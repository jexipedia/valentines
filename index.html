    <script>
      // Basic JS for play/pause/seek
      const audio = document.getElementById('customAudio');
      const playStatus = document.getElementById('playStatus');
      const progressBar = document.getElementById('progressBar');
      const currentTime = document.getElementById('currentTime');
      const totalTime = document.getElementById('totalTime');
      const backwardBtn = document.getElementById('backwardBtn');
      const forwardBtn = document.getElementById('forwardBtn');
      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }
      audio.addEventListener('loadedmetadata', () => {
        totalTime.textContent = formatTime(audio.duration);
        progressBar.max = Math.floor(audio.duration);
      });
      audio.addEventListener('timeupdate', () => {
        currentTime.textContent = formatTime(audio.currentTime);
        progressBar.value = Math.floor(audio.currentTime);
      });
      progressBar.addEventListener('input', (e) => {
        audio.currentTime = e.target.value;
      });
      playStatus.addEventListener('change', (e) => {
        if (e.target.checked) {
          audio.play();
        } else {
          audio.pause();
        }
      });
      backwardBtn.addEventListener('click', () => {
        audio.currentTime = Math.max(audio.currentTime - 10, 0);
      });
      forwardBtn.addEventListener('click', () => {
        audio.currentTime = Math.min(audio.currentTime + 10, audio.duration);
      });
    </script>

    <div id="valentineModal" class="fixed left-1/2 z-[10000] flex items-start justify-center w-full" style="top: 65%; transform: translateX(-50%);">
      <div class="bg-white bg-opacity-0 rounded-2xl shadow-lg p-8 flex flex-col items-center">
        <p class="text-2xl font-bold mb-6 text-pink-600">Will you be my valentine?</p>
        <div class="flex space-x-6">
          <button id="yesBtn" class="px-6 py-2 bg-pink-500 text-white rounded-lg font-semibold text-lg hover:bg-pink-600 transition">Yes</button>
          <button id="noBtn" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg font-semibold text-lg transition relative">No</button>
        </div>
      </div>
    </div>
    <script>
      // No button movement logic
      const noBtn = document.getElementById('noBtn');
      const modal = document.getElementById('valentineModal');
      const yesBtn = document.getElementById('yesBtn');
      let moveCount = 0;
      function moveNoButton() {
        const modalRect = modal.getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();
        const maxX = modalRect.width - btnRect.width - 20;
        const maxY = modalRect.height - btnRect.height - 20;
        const randX = Math.random() * maxX;
        const randY = Math.random() * maxY;
        noBtn.style.position = 'absolute';
        noBtn.style.left = randX + 'px';
        noBtn.style.top = randY + 'px';
        moveCount++;
      }
      noBtn.addEventListener('mouseenter', moveNoButton);
      noBtn.addEventListener('mousedown', moveNoButton);
      // Yes button logic
      yesBtn.addEventListener('click', () => {
        // Replace modal content with the message
        modal.innerHTML = `<div class='bg-transparent flex flex-col items-center'>
          <span class="text-3xl font-extrabold bg-gradient-to-r from-pink-400 via-fuchsia-500 to-red-400 bg-clip-text text-transparent animate-bounce drop-shadow-lg">
            I knew you wouldn't say no!
          </span>
          <span class="text-3xl drop-shadow-lg mt-2">&#128527;</span>
        </div>`;
      });
    </script>
  </body>
</html>
